<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1030" />
  <title>별밤책 · 시범</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@700&family=Jua&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; overflow:hidden; }
    body {
      font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      color:#e7e2f5; -webkit-user-select:none; user-select:none; touch-action:manipulation;
      background:linear-gradient(180deg,#0b1030 0%,#141a45 55%,#232a5c 100%);
    }
    .sky { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
    .star { position:absolute; border-radius:50%; background:#fdf3d0; opacity:.25; animation:tw ease-in-out infinite; }
    @keyframes tw { 0%,100%{opacity:.15;transform:scale(.9)} 50%{opacity:.75;transform:scale(1.15)} }

    /* ===== 홈(이야기 고르기) ===== */
    .home { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; }
    .home-head { padding:calc(26px + env(safe-area-inset-top)) 20px 8px; text-align:center; }
    .home-title { font-family:"Dongle","Jua",sans-serif; font-weight:700; font-size:64px; line-height:.9;
      background:linear-gradient(180deg,#ffe9b3,#ffd79a 60%,#f4b46a); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .home-sub { font-size:15px; color:#aab2e0; margin-top:8px; }
    .story-list { list-style:none; flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
      padding:12px 16px calc(24px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px;
      max-width:560px; width:100%; margin:0 auto; }
    .scard { display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:20px; cursor:pointer;
      border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); transition:transform .1s ease, background .1s ease; }
    .scard:active { transform:scale(.98); background:rgba(255,255,255,.1); }
    .scover { font-size:40px; line-height:1; flex:none; width:52px; text-align:center; filter:drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
    .sinfo { flex:1; display:flex; flex-direction:column; gap:6px; min-width:0; }
    .sname { font-family:"Jua",sans-serif; font-size:21px; color:#f3efff; }
    .spills { display:flex; gap:8px; }
    .spill { font-size:13px; padding:3px 10px; border-radius:999px; color:#9aa3d8;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); }
    .spill.part { color:#ffe4b0; border-color:rgba(255,233,179,.35); background:rgba(255,233,179,.1); }
    .spill.full { color:#bff0da; border-color:rgba(116,211,171,.5); background:rgba(116,211,171,.16); }
    .schev { font-size:22px; color:#ffe9b3; flex:none; }

    /* ===== 녹음+확인 화면 ===== */
    .app { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; }

    .top { padding:calc(12px + env(safe-area-inset-top)) 16px 4px; display:flex; flex-direction:column; align-items:center; gap:10px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; max-width:520px; }
    .homebtn { font-family:inherit; font-size:20px; width:40px; height:40px; border-radius:50%; cursor:pointer; flex:none;
      border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:#cdd3f5; }
    .homebtn:active { transform:scale(.92); }
    .rtitle { font-family:"Dongle","Jua",sans-serif; font-weight:700; font-size:34px; line-height:.9; text-align:center; flex:1;
      background:linear-gradient(180deg,#ffe9b3,#ffd79a 60%,#f4b46a); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .voices { display:flex; gap:8px; }
    .vtab { font-family:inherit; font-size:16px; padding:6px 16px; border-radius:999px; cursor:pointer;
      border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#cdd3f5; }
    .vtab.on { background:#ffe9b3; border-color:#ffe9b3; color:#3a2f10; }
    .prog { display:flex; align-items:center; gap:8px; font-size:13px; color:#9aa3d8; min-height:16px; }
    .pdots { display:flex; gap:5px; }
    .pd { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.16); }
    .pd.done { background:#ffe9b3; }
    .pd.now { outline:2px solid rgba(255,233,179,.5); outline-offset:2px; }

    /* 무대 */
    .stage { flex:1; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:20px; padding:2vh 5vw; text-align:center; }
    .art { font-size:clamp(4.2rem,20vmin,9rem); line-height:1.1; filter:drop-shadow(0 6px 18px rgba(0,0,0,.45)); }
    .text { max-width:640px; }
    .ln { display:block; font-size:clamp(1.05rem,4.5vmin,1.5rem); line-height:1.65; color:#e7e2f5;
      text-shadow:0 2px 8px rgba(0,0,0,.5); word-break:keep-all; margin-bottom:5px; }
    .ln .nm { color:#ffe9b3; white-space:nowrap; }
    .scene-in { animation:fin .7s ease both; }
    @keyframes fin { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    .pager { display:flex; align-items:center; justify-content:center; gap:20px; }
    .pnav { width:46px; height:46px; border-radius:50%; cursor:pointer;
      border:1px solid rgba(255,255,255,.24); background:rgba(255,255,255,.1); color:#ffe9b3;
      font-size:20px; display:flex; align-items:center; justify-content:center; }
    .pnav:disabled { opacity:.25; } .pnav:active { transform:scale(.9); }
    .ppos { font-size:15px; color:#cdd3f5; min-width:84px; text-align:center; }

    /* 하단 */
    .bottom { padding:14px 20px calc(20px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; gap:10px; }
    .main-btn { font-family:inherit; font-size:21px; border:none; border-radius:20px; padding:17px 24px; cursor:pointer; width:100%; max-width:420px; }
    .main-btn:active { transform:scale(.98); }
    .rec { background:#ff6b7a; color:#fff; }
    .listen { font-family:inherit; font-size:15px; padding:8px 18px; border-radius:999px; cursor:pointer;
      border:1px solid rgba(255,255,255,.24); background:rgba(255,255,255,.08); color:#cdd3f5; transition:transform .1s ease, background .1s ease, border-color .1s ease; }
    .listen:active { transform:scale(.95); }
    .listen.on { background:rgba(116,211,171,.22); border-color:#74d3ab; color:#bff0da; }

    .recing { color:#ff9aa6; } .recdot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#ff6b7a; margin-right:5px; vertical-align:middle; animation:blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
    .toast { position:fixed; left:50%; top:calc(20px + env(safe-area-inset-top)); transform:translateX(-50%) translateY(-10px);
      background:rgba(0,0,0,.85); color:#fff; padding:11px 18px; border-radius:999px; font-size:15px; opacity:0; transition:.2s; z-index:20; pointer-events:none; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"></div>

  <!-- 홈: 이야기 고르기 -->
  <section class="home" id="home">
    <div class="home-head">
      <div class="home-title">별밤책</div>
      <div class="home-sub">오늘은 어떤 이야기를 들려줄까요?</div>
    </div>
    <ul class="story-list" id="storyList"></ul>
  </section>

  <!-- 녹음+확인 화면 -->
  <div class="app" id="recView" style="display:none">
    <div class="top">
      <div class="topbar">
        <button class="homebtn" id="btnHome" aria-label="이야기 목록으로">🏠</button>
        <span class="rtitle" id="recTitle">이야기</span>
        <span style="width:40px;flex:none"></span>
      </div>
      <div class="voices">
        <button class="vtab on" data-voice="mom">🌷 엄마</button>
        <button class="vtab" data-voice="dad">🌰 아빠</button>
      </div>
      <div class="prog" id="prog"></div>
    </div>

    <div class="stage" id="stage">
      <div class="art scene-in" id="art">🐻</div>
      <div class="text scene-in" id="text"></div>
    </div>

    <div class="bottom" id="bottom"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (() => {
    "use strict";
    // ===== 대본: 내용 그대로, 2~3문장씩 한 장면으로 묶음 (이모지만 추가) =====
    const STORIES = [
      { id:"three-pigs", title:"아기 돼지 삼 형제", cover:"🐷", scenes:[
        { emoji:"🐷", lines:["옛날 옛날에 아기 돼지 삼 형제가 살았어요.","어느덧 자라서, 각자 집을 짓기로 했지요."] },
        { emoji:"🏠", lines:["첫째 돼지는 지푸라기로 후다닥 집을 지었어요.","둘째 돼지는 나무로 뚝딱뚝딱 집을 지었어요.","셋째 돼지는 벽돌로 차곡차곡, 오래오래 집을 지었어요."] },
        { emoji:"🐺", lines:["그때 배고픈 늑대가 어슬렁어슬렁 나타났어요.","\"후~ 불면 다 날아가라!\""] },
        { emoji:"💨", lines:["늑대가 후! 불자 지푸라기 집이 폭삭 무너졌어요.","첫째 돼지는 깜짝 놀라 둘째네 집으로 도망쳤어요."] },
        { emoji:"🌬️", lines:["늑대가 후우! 불자 나무 집도 와르르 무너졌지요.","둘은 함께 셋째네 벽돌 집으로 달려갔어요."] },
        { emoji:"🧱", lines:["늑대가 후우우! 아무리 불어도 벽돌 집은 끄떡없었어요.","늑대는 씩씩대다가 그만 멀리 도망가 버렸어요."] },
        { emoji:"💗", lines:["아기 돼지 삼 형제는 튼튼한 집에서","오래오래 사이좋게 살았답니다."] },
        { emoji:"🌙", lines:["{이름아}, 우리도 포근한 집에서 폭 자자."] },
      ]},
      { id:"red-hood", title:"빨간 모자", cover:"🧺", scenes:[
        { emoji:"🧺", lines:["빨간 모자를 쓴 예쁜 아이가 있었어요.","어느 날 엄마가 바구니를 건네며 말했어요."] },
        { emoji:"🥣", lines:["\"할머니가 편찮으시대. 이 따뜻한 죽 좀 갖다 드리렴.\"","\"네, 엄마! 얼른 다녀올게요.\""] },
        { emoji:"🌳", lines:["빨간 모자는 숲길을 콧노래 부르며 걸었어요.","새들이 지저귀고, 햇살이 반짝였지요."] },
        { emoji:"🐺", lines:["그때 커다란 늑대가 슬그머니 다가왔어요.","\"안녕, 빨간 모자야. 어디 가니?\"","\"할머니 댁에 가요. 저 언덕 너머 작은 집이요.\""] },
        { emoji:"🌸", lines:["늑대는 침을 꼴깍 삼키며 꾀를 냈어요.","\"그래? 그럼 예쁜 꽃도 좀 꺾어 가렴.\""] },
        { emoji:"🏃", lines:["빨간 모자가 꽃을 꺾는 사이,","늑대는 지름길로 할머니 집에 먼저 도착했어요.","그러고는 할머니인 척 이불 속에 쏙 누웠지요."] },
        { emoji:"🚪", lines:["잠시 뒤, 빨간 모자가 문을 똑똑 두드렸어요.","\"할머니, 눈이 왜 이렇게 커요?\"","\"너를 더 잘 보려고 그런단다.\""] },
        { emoji:"👂", lines:["\"할머니, 귀는 왜 이렇게 커요?\"","\"네 목소리를 더 잘 들으려고 그렇지.\"","\"할머니, 입은 왜 이렇게 커요?\""] },
        { emoji:"🪓", lines:["바로 그때, 밖에서 나무를 하던 사냥꾼이 이상한 소리를 들었어요.","사냥꾼이 문을 벌컥 열자, 늑대는 깜짝 놀라 후다닥 도망쳤어요.","옷장에 숨어 있던 진짜 할머니도 무사히 나왔지요."] },
        { emoji:"🤗", lines:["빨간 모자와 할머니는 서로를 꼭 껴안았어요.","\"무서웠지? 이제 다 괜찮아.\"","셋은 따뜻한 죽을 나눠 먹으며 도란도란 이야기했답니다."] },
        { emoji:"🌙", lines:["{이름아}, 오늘도 폭 안아줄게. 잘 자렴."] },
      ]},
      { id:"ugly-duckling", title:"미운 아기 오리", cover:"🦢", scenes:[
        { emoji:"🥚", lines:["엄마 오리가 둥지에서 알을 품고 있었어요.","하나둘 톡, 톡 — 아기 오리들이 깨어났어요.","\"삐약삐약!\" 노란 아기들이 줄줄이 나왔지요."] },
        { emoji:"🐣", lines:["그런데 마지막 알은 유난히 컸어요.","한참 뒤 톡 깨어난 아기는, 크고 회색빛이었어요."] },
        { emoji:"😕", lines:["다른 오리들이 수군거렸어요.","\"쟤는 왜 저렇게 생겼어? 우리랑 다르잖아.\""] },
        { emoji:"😢", lines:["아기 오리는 어디를 가도 놀림을 받았어요.","닭도, 고양이도 쌀쌀맞게 굴었지요.","슬픈 아기 오리는 그만 집을 떠났어요."] },
        { emoji:"❄️", lines:["혼자가 된 아기 오리에게 추운 겨울이 왔어요.","찬바람이 불고, 연못은 꽁꽁 얼었어요.","그래도 아기 오리는 울지 않고 씩씩하게 견뎠어요."] },
        { emoji:"🌷", lines:["긴 겨울이 지나고, 드디어 따뜻한 봄이 왔지요.","얼음 녹은 연못 위로 하얀 새들이 우아하게 헤엄쳤어요.","\"와, 정말 아름다운 백조들이야!\""] },
        { emoji:"💧", lines:["아기 오리가 물에 살며시 얼굴을 비춰 보았어요.","그런데 이게 웬일이에요?"] },
        { emoji:"🦢", lines:["물속엔 크고 새하얀, 아름다운 백조가 있었어요.","미운 아기 오리가 아니라, 멋진 백조가 되어 있었던 거예요!"] },
        { emoji:"✨", lines:["\"너였구나! 이렇게 예쁜 백조였어!\"","아기 오리는 그제야 환하게 웃었답니다."] },
        { emoji:"🌙", lines:["{이름아}, 너도 아기 오리처럼 무럭무럭 예쁘게 자랄 거야."] },
      ]},
      { id:"bear-stars", title:"별을 세는 아기 곰", cover:"🐻", scenes:[
        { emoji:"🐻", lines:["잠이 오지 않는 아기 곰이 있었어요.","엄마 곰이 다정하게 말했어요.","\"우리, 별을 세어 볼까?\""] },
        { emoji:"🌌", lines:["둘은 창밖 깜깜한 밤하늘을 올려다봤어요.","\"하나, 반짝. 둘, 반짝. 셋, 반짝.\""] },
        { emoji:"😌", lines:["별을 셀수록 아기 곰의 눈이 스르르 감겼어요.","\"저 별은 우리 아기를 지켜 준단다.\"","\"저 별은 좋은 꿈을 가져다준대.\""] },
        { emoji:"🍃", lines:["바람이 살랑 불어와 이불을 덮어 주었어요.","아기 곰은 어느새 새근새근 잠이 들었어요."] },
        { emoji:"🌙", lines:["{이름아}, 우리도 별을 세며 잘 자자.","하나… 둘… 셋… 쉬…"] },
      ]},
      { id:"moon-dream", title:"달님이 데려다준 꿈나라", cover:"🌙", scenes:[
        { emoji:"🌙", lines:["깜깜한 밤, 둥근 달님이 방긋 웃었어요.","\"우리 아기, 이제 잘 시간이야.\""] },
        { emoji:"🌟", lines:["달님은 부드러운 달빛으로 이불을 만들어 주었어요.","별들이 하나둘 이불 위에 살포시 내려앉았지요."] },
        { emoji:"☁️", lines:["\"좋은 꿈나라로 함께 갈까?\"","아기는 폭신한 구름 배에 올라탔어요.","구름 배는 두둥실, 두둥실 떠올랐어요."] },
        { emoji:"🏘️", lines:["아래에는 잠든 마을이 조용히 빛나고 있었어요.","토끼도, 강아지도, 아기 새도 모두 코 자고 있었지요."] },
        { emoji:"😴", lines:["\"잘 자, 잘 자.\" 달님이 나직이 속삭였어요.","아기는 달님 품에서 스르르 잠이 들었어요."] },
        { emoji:"💤", lines:["{이름아}, 좋은 꿈 꾸렴."] },
      ]},
    ];
    const VLABEL = { mom:"엄마", dad:"아빠" };

    let storyIdx=0, story=STORIES[storyIdx], N=story.scenes.length;
    let voice="mom", cur=0;
    let recorder=null, chunks=[], stream=null, recording=false;
    let recorded=new Set();
    let previewAudio=null, previewPlaying=false;

    const $=(id)=>document.getElementById(id);
    const homeEl=$("home"), recViewEl=$("recView"), storyListEl=$("storyList"), recTitleEl=$("recTitle");
    const artEl=$("art"), textEl=$("text"), progEl=$("prog"), bottomEl=$("bottom"),
          stageEl=$("stage"), toastEl=$("toast");

    (function(){ const sky=$("sky"); for(let i=0;i<40;i++){ const s=document.createElement("span"); s.className="star";
      s.style.left=(Math.random()*100).toFixed(1)+"%"; s.style.top=(Math.random()*100).toFixed(1)+"%";
      const sz=(2+Math.random()*3).toFixed(1); s.style.width=sz+"px"; s.style.height=sz+"px";
      s.style.animationDelay=(Math.random()*4).toFixed(2)+"s"; s.style.animationDuration=(2.5+Math.random()*3).toFixed(2)+"s"; sky.appendChild(s);} })();

    let toastTimer=null;
    function toast(m){ toastEl.textContent=m; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove("show"),2400); }

    function babyName(){ try{ return (localStorage.getItem("babyName")||"").trim(); }catch(e){ return ""; } }
    function josa(n){ if(!n) return "야"; const c=n.charCodeAt(n.length-1); if(c>=0xAC00&&c<=0xD7A3) return ((c-0xAC00)%28===0)?"야":"아"; return "야"; }
    function renderName(t){ const n=babyName(), shown=n||"아기 이름"; return t.replace(/\{이름아\}/g,'<span class="nm">('+shown+')'+josa(n)+'</span>'); }

    // ===== 저장(IndexedDB) =====
    let dbp=null;
    function db(){ if(dbp) return dbp; dbp=new Promise((res,rej)=>{ const r=indexedDB.open("voicebook-demo",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("clips",{keyPath:"key"}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return dbp; }
    const STORE_VER="v2"; // 이전 시범(12장면) 데이터와 섞이지 않게 버전 분리
    const key=(v,i)=>`${story.id}:${STORE_VER}:${v}:${i}`;
    async function getClip(v,i){ const d=await db(); return new Promise((res,rej)=>{ const t=d.transaction("clips").objectStore("clips").get(key(v,i)); t.onsuccess=()=>res(t.result||null); t.onerror=()=>rej(t.error); }); }
    async function putClip(v,i,blob,mime){ const d=await db(); return new Promise((res,rej)=>{ const t=d.transaction("clips","readwrite").objectStore("clips").put({key:key(v,i),blob,mime}); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }
    async function loadRecorded(v){ const d=await db(); return new Promise((res,rej)=>{ const t=d.transaction("clips").objectStore("clips").getAllKeys();
      t.onsuccess=()=>{ const pre=`${story.id}:${STORE_VER}:${v}:`; res(new Set((t.result||[]).filter(k=>k.indexOf(pre)===0).map(k=>+k.slice(pre.length)).filter(i=>i>=0&&i<N))); }; t.onerror=()=>rej(t.error); }); }
    // 홈에서 5편 × 엄마/아빠 진행상황을 한 번에 읽기
    async function loadAllProgress(){ const d=await db(); return new Promise((res,rej)=>{ const t=d.transaction("clips").objectStore("clips").getAllKeys();
      t.onsuccess=()=>{ const map={};
        (t.result||[]).forEach(k=>{ const p=String(k).split(":"); if(p.length!==4) return;
          const sid=p[0], ver=p[1], v=p[2], idx=+p[3];
          if(ver!==STORE_VER) return; if(v!=="mom"&&v!=="dad") return; if(!(idx>=0)) return;
          (map[sid]=map[sid]||{mom:new Set(),dad:new Set()})[v].add(idx); });
        res(map); }; t.onerror=()=>rej(t.error); }); }

    function pickMime(){ const c=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac","audio/ogg;codecs=opus"];
      if(window.MediaRecorder&&MediaRecorder.isTypeSupported){ for(const t of c) if(MediaRecorder.isTypeSupported(t)) return t; } return ""; }

    function doneCount(){ let c=0; for(let i=0;i<N;i++) if(recorded.has(i)) c++; return c; }
    // 이 화면은 '녹음 + 확인' 단일 모드 (아기에게 들려주는 자동재생은 여기 없음)

    // ===== 홈 렌더 =====
    async function renderHome(){
      let prog={}; try{ prog=await loadAllProgress(); }catch(e){ prog={}; }
      storyListEl.innerHTML = STORIES.map((s,i)=>{
        const p=prog[s.id]||{mom:new Set(),dad:new Set()};
        const sN=s.scenes.length;
        const cnt=(set)=>{ let c=0; set.forEach(x=>{ if(x>=0&&x<sN) c++; }); return c; };
        const mc=cnt(p.mom), dc=cnt(p.dad);
        const cls=(c)=> c===0?'' : (c>=sN?'full':'part');
        const pill=(emoji,c)=>`<span class="spill ${cls(c)}">${emoji} ${c}/${sN}</span>`;
        return `<li class="scard" data-idx="${i}">`+
          `<span class="scover">${s.cover}</span>`+
          `<span class="sinfo"><span class="sname">${s.title}</span>`+
          `<span class="spills">${pill('🌷',mc)}${pill('🌰',dc)}</span></span>`+
          `<span class="schev">❯</span></li>`;
      }).join("");
      storyListEl.querySelectorAll(".scard").forEach(el=>el.onclick=()=>openStory(+el.dataset.idx));
    }

    async function showHome(){
      if(recording){ toast("녹음을 먼저 멈춰 주세요"); return; }
      stopAllAudio();
      recViewEl.style.display="none"; homeEl.style.display="flex";
      await renderHome();
    }

    async function openStory(i){
      stopAllAudio();
      storyIdx=i; story=STORIES[i]; N=story.scenes.length; cur=0;
      recTitleEl.textContent=story.title;
      homeEl.style.display="none"; recViewEl.style.display="flex";
      recorded=await loadRecorded(voice); render(true);
    }

    // ===== 녹음 화면 렌더 =====
    function paintScene(anim){ const sc=story.scenes[cur];
      artEl.textContent=sc.emoji;
      textEl.innerHTML = sc.lines.map(l=>`<span class="ln">${renderName(l)}</span>`).join("");
      if(anim){ [artEl,textEl].forEach(el=>{ el.classList.remove("scene-in"); void el.offsetWidth; el.classList.add("scene-in"); }); }
    }

    function renderTop(){
      if(recording){ progEl.innerHTML=`<span class="recing"><span class="recdot"></span>녹음 중… 다 읽으면 <b>멈춤</b></span>`; return; }
      let dots=""; for(let i=0;i<N;i++) dots+=`<span class="pd ${recorded.has(i)?'done':''} ${i===cur?'now':''}"></span>`;
      progEl.innerHTML = `<span class="pdots">${dots}</span><span>${doneCount()} / ${N} 녹음</span>`;
    }

    function renderBottom(){
      // 넘김 페이저는 녹음 중에도 유지(화살표만 비활성). 녹음 버튼은 항상 맨 아래 고정.
      const recBtn = recording
        ? `<button class="main-btn rec" id="bStop">■ 멈춤</button>`
        : `<button class="main-btn rec" id="bRec">🔴 ${recorded.has(cur)?'이 장면 다시 녹음':'이 장면 녹음'}</button>`;
      let html = `<div class="pager">`+
        `<button class="pnav" id="bPrev" ${cur===0||recording?'disabled':''} aria-label="이전 장면">❮</button>`+
        `<span class="ppos">${cur+1} / ${N} 장면</span>`+
        `<button class="pnav" id="bNext" ${cur===N-1||recording?'disabled':''} aria-label="다음 장면">❯</button>`+
      `</div>`;
      if(recorded.has(cur) && !recording)
        html += `<button class="listen ${previewPlaying?'on':''}" id="bConfirm">${previewPlaying?'⏸ 멈추기':'🔊 녹음 확인'}</button>`;
      html += recBtn;
      bottomEl.innerHTML=html;
      const bp=$("bPrev"); if(bp) bp.onclick=()=>go(cur-1);
      const bn=$("bNext"); if(bn) bn.onclick=()=>go(cur+1);
      const bc=$("bConfirm"); if(bc) bc.onclick=togglePreview;
      const br=$("bRec"); if(br) br.onclick=startRec;
      const bs=$("bStop"); if(bs) bs.onclick=stopRec;
    }

    function render(anim){ paintScene(anim); renderTop(); renderBottom(); }

    async function setVoice(v){ if(v===voice||recording) return; stopAllAudio(); voice=v; cur=0;
      document.querySelectorAll(".vtab").forEach(t=>t.classList.toggle("on",t.dataset.voice===v));
      recorded=await loadRecorded(voice); render(true); }

    // ===== 녹음 =====
    async function startRec(){
      stopPreview();
      if(!navigator.mediaDevices||!window.MediaRecorder){ toast("이 브라우저는 녹음을 지원하지 않아요"); return; }
      try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ toast("마이크 사용을 허용해 주세요 🎤"); return; }
      const mime=pickMime();
      try{ recorder=mime? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream); }catch(e){ recorder=new MediaRecorder(stream); }
      chunks=[]; recorder.ondataavailable=(e)=>{ if(e.data&&e.data.size) chunks.push(e.data); };
      recorder.onstop=onStop; recorder.start(); recording=true;
      renderTop(); renderBottom();
    }
    function stopRec(){ if(recorder&&recorder.state!=="inactive") recorder.stop(); }
    async function onStop(){
      const mime=(recorder&&recorder.mimeType)||pickMime()||"audio/webm";
      const blob=new Blob(chunks,{type:mime});
      if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } recorder=null; recording=false;
      if(!blob.size){ toast("녹음이 비어 있어요"); render(false); return; }
      try{ await putClip(voice,cur,blob,mime); recorded.add(cur); }catch(e){ toast("저장 실패 (저장 공간 확인)"); render(false); return; }
      // 바로 다음 미녹음 장면으로 (팝업 없이 진행 표시만 갱신)
      let nxt=-1; for(let k=1;k<=N;k++){ const i=(cur+k)%N; if(!recorded.has(i)){ nxt=i; break; } }
      if(nxt>=0){ cur=nxt; } // 남은 장면으로
      render(true);
    }
    async function togglePreview(){
      if(previewPlaying){ stopPreview(); renderBottom(); return; }
      const rec=await getClip(voice,cur); if(!rec){ toast("이 장면 녹음이 없어요"); return; }
      stopPreview();
      previewAudio=new Audio(URL.createObjectURL(rec.blob));
      previewAudio.onended=()=>{ previewPlaying=false; renderBottom(); };
      previewAudio.onerror=()=>{ previewPlaying=false; renderBottom(); toast("재생할 수 없어요"); };
      previewPlaying=true; renderBottom();
      previewAudio.play().catch(()=>{ previewPlaying=false; renderBottom(); toast("재생할 수 없어요"); });
    }
    function stopPreview(){ if(previewAudio){ try{previewAudio.pause()}catch(e){} previewAudio=null; } previewPlaying=false; }
    function stopAllAudio(){ stopPreview(); }

    // 장면 이동. 녹음 확인(미리듣기) 중이었다면, 옮긴 장면의 녹음을 바로 이어 들려줌(빠른 확인).
    function go(i){ if(recording) return; const t=Math.max(0,Math.min(i,N-1)); if(t===cur) return;
      const wasPreview=previewPlaying; stopPreview(); cur=t; render(true);
      if(wasPreview && recorded.has(cur)) togglePreview(); }

    document.addEventListener("keydown",(e)=>{ if(recViewEl.style.display==="none") return; if(recording) return;
      if(e.key==="ArrowLeft") go(cur-1); else if(e.key==="ArrowRight") go(cur+1); });
    document.querySelectorAll(".vtab").forEach(t=>t.onclick=()=>setVoice(t.dataset.voice));
    $("btnHome").onclick=showHome;

    // 시작: 홈부터
    showHome();
  })();
  </script>
</body>
</html>
