<!DOCTYPE html>
<html lang="ko" data-v="v35">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141a3a" />
  <meta name="description" content="엄마·아빠 목소리로 읽어주는 우리 아기 잠자리 그림책, 별밤책. 녹음도 재생도 이 기기 안에서만." />
  <title>별밤책 🌙</title>

  <!-- PWA / 홈화면 추가 -->
  <link rel="manifest" href="manifest.webmanifest?v=35" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="별밤책" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@700&family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=35" />
</head>
<body>
  <!-- 밤하늘 배경 (모든 화면 공통) -->
  <div class="night-sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="moon"></div>
  </div>

  <!-- ===== 홈 화면(아기용): 이야기 고르기 =====
       그림 카드 2열. 순서는 대본 순서 그대로 절대 안 바뀐다(아기가 위치로 기억하니까).
       녹음이 아직 없는 이야기는 흐릿하게, 자리는 그대로 지킨다. -->
  <section id="home" class="screen active">
    <header class="home-head">
      <!-- 아기 이름: 넣으면 제목 위에 "○○이의", 없으면 아래 알약 버튼 -->
      <button id="nameOwner" class="name-owner" type="button" hidden></button>
      <h1 class="app-title">별밤책</h1>
      <p class="app-sub">오늘은 어떤 이야기를 들려줄까요?</p>
      <button id="nameChip" class="name-chip" type="button">👶 아기 이름 정하기</button>
    </header>

    <div class="home-top">
      <button id="shuffleBtn" class="shuffle-btn" type="button" hidden>🌙 쭉 들려주기</button>
      <p id="emptyNote" class="empty-note" hidden></p>
    </div>

    <ul id="storyGrid" class="story-grid" aria-label="이야기 목록"></ul>

    <footer class="home-foot">
      <!-- 아직 앱으로 안 쓰는 사람에게만 보이는 띠 (JS가 판단해서 켠다) -->
      <button id="installBar" class="install-bar" type="button" hidden>📲 홈 화면에 앱처럼 추가하기</button>
      <div class="foot-links">
        <button id="shareBtn" class="foot-link gift" type="button">🔗 알려주기</button>
        <button id="recEntry" class="foot-link" type="button">🎙 녹음하기</button>
        <button id="moreBtn" class="foot-link" type="button">⚙️ 더보기</button>
      </div>
      <p class="privacy-note" id="footNote"></p>
    </footer>
  </section>

  <!-- ===== 녹음할 이야기 고르기(부모용) ===== -->
  <section id="pick" class="screen pick-screen">
    <div class="topbar">
      <button id="pickHome" class="icon-btn" type="button" aria-label="홈으로" title="홈으로">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 3.2l9 7.8h-2.2V20h-4.6v-5.4h-4.4V20H5V11H2.8L12 3.2z"/></svg>
      </button>
      <h2 class="pick-title">녹음하기</h2>
      <span class="head-spacer" aria-hidden="true"></span>
    </div>
    <p class="pick-sub">어떤 이야기를 녹음할까요?</p>

    <ul id="pickList" class="story-list" aria-label="녹음할 이야기 목록"></ul>

    <footer class="home-foot">
      <p class="privacy-note">🎤 조용한 방에서, 마이크는 <b>한 뼘 정도</b> 떨어뜨려 주세요</p>
    </footer>
  </section>

  <!-- ===== 녹음 화면(부모용): 장면마다 녹음하고 확인 ===== -->
  <section id="rec" class="screen rec-screen">
    <div class="rec-top">
      <div class="topbar">
        <button id="recBack" class="icon-btn" type="button" aria-label="녹음할 이야기 고르기로" title="이야기 고르기">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        </button>
        <h2 id="recTitle" class="rec-title">이야기</h2>
        <button id="recHome" class="icon-btn" type="button" aria-label="홈으로" title="홈으로">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 3.2l9 7.8h-2.2V20h-4.6v-5.4h-4.4V20H5V11H2.8L12 3.2z"/></svg>
        </button>
      </div>
      <div class="voices" role="tablist" aria-label="누구 목소리인지 고르기">
        <span class="voices-q">누구 목소리?</span>
        <button class="vtab" data-voice="mom" role="tab">👩 엄마</button>
        <button class="vtab" data-voice="dad" role="tab">👨 아빠</button>
      </div>
      <div id="recProg" class="prog"></div>
      <p id="legacyNote" class="legacy-note" hidden></p>
    </div>

    <div class="stage">
      <div id="recArt" class="art scene-in">🌙</div>
      <div id="recText" class="text scene-in"></div>
    </div>

    <div id="recBottom" class="rec-bottom"></div>
  </section>

  <!-- ===== 들려주기 화면(아기용): 목소리 따라 그림이 넘어감 ===== -->
  <section id="play" class="screen play-screen">
    <!-- 왼쪽 위 홈 버튼: 읽는 중에도 계속 보인다 -->
    <button id="playHome" class="icon-btn corner-home" type="button" aria-label="홈으로" title="홈으로">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 3.2l9 7.8h-2.2V20h-4.6v-5.4h-4.4V20H5V11H2.8L12 3.2z"/></svg>
    </button>
    <div id="playStage" class="stage">
      <div id="playArt" class="art scene-in">🌙</div>
      <div id="playText" class="text scene-in"></div>
    </div>
    <div id="pauseOv" class="pause-ov" hidden></div>
  </section>

  <!-- ===== 공용 모달(이름 · 더보기[백업·도움말·의견]) ===== -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button id="modalClose" class="modal-close" aria-label="닫기">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Netlify Forms 감지용 숨은 폼 (실제 전송은 앱 안 폼에서 함) -->
  <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="message" />
    <input type="email" name="email" />
    <input type="text" name="bot-field" />
  </form>

  <!-- 백업 복원용 숨은 input -->
  <input type="file" id="restoreInput" accept=".txt,.json,text/plain,application/json" hidden />

  <!-- 토스트 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="scripts-data.js?v=35"></script>
  <script src="analytics.js?v=35"></script>
  <script src="app.js?v=35"></script>
</body>
</html>
