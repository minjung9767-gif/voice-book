<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141a3a" />
  <meta name="description" content="엄마·아빠 목소리로 읽어주는 우리 아기 잠자리 그림책, 별밤책. 녹음도 재생도 이 기기 안에서만." />
  <title>별밤책 🌙</title>

  <!-- PWA / 홈화면 추가 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="별밤책" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 밤하늘 배경 (모든 화면 공통) -->
  <div class="night-sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="moon"></div>
  </div>

  <!-- ===== 홈 화면 ===== -->
  <section id="home" class="screen active">
    <header class="home-head">
      <!-- 아기 이름: 넣으면 제목 위에 "○○이의", 없으면 아래 알약 버튼 -->
      <button id="nameOwner" class="name-owner" type="button" hidden></button>
      <h1 class="app-title">별밤책</h1>
      <p class="app-sub">엄마·아빠 목소리로, 포근한 밤.</p>
      <button id="nameChip" class="name-chip" type="button">👶 아기 이름 정하기</button>
    </header>

    <ul id="scriptList" class="script-list" aria-label="이야기 목록"></ul>

    <footer class="home-foot">
      <button id="moreBtn" class="foot-link" type="button">⚙️ 더보기</button>
      <p class="privacy-note" id="footNote"></p>
    </footer>
  </section>

  <!-- ===== 이야기 화면: 대본 보기 · 녹음 · 재생 ===== -->
  <section id="story" class="screen">
    <header class="story-head">
      <button id="backBtn" class="icon-btn" aria-label="뒤로">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="storyTitle" class="story-title">이야기</h2>
      <span class="head-spacer" aria-hidden="true"></span>
    </header>

    <!-- 누구 목소리인지 고르기 -->
    <div class="voice-tabs" role="tablist" aria-label="목소리 고르기">
      <button class="voice-tab active" data-voice="mom" role="tab">👩 엄마</button>
      <button class="voice-tab" data-voice="dad" role="tab">👨 아빠</button>
    </div>
    <p class="voice-hint">엄마·아빠 <b>각각</b> 목소리를 담을 수 있어요</p>

    <!-- 대본 -->
    <div id="scriptBody" class="script-body"></div>

    <!-- 녹음/재생 조작판 -->
    <div class="dock">
      <div id="dockStatus" class="dock-status"></div>
      <div id="dockControls" class="dock-controls"></div>
    </div>
  </section>

  <!-- ===== 보기 화면(아기용): 밤 무드등 + 목소리 (글자 없음) ===== -->
  <section id="player" class="screen player">
    <button id="playerClose" class="player-close" aria-label="닫기">✕</button>
    <div class="mood">
      <div class="mood-emoji" id="moodEmoji" aria-hidden="true">🌙</div>
      <p class="mood-title" id="moodTitle"></p>
    </div>
    <div class="player-controls">
      <button id="shuffleToggle" class="pill" type="button" aria-pressed="false">🔀 이어서 자동 재생</button>
      <button id="playPause" class="pill pill-main" type="button" aria-label="재생/멈춤">⏸ 멈춤</button>
    </div>
  </section>

  <!-- ===== 공용 모달(이름 · 더보기[백업·도움말·의견]) ===== -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button id="modalClose" class="modal-close" aria-label="닫기">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Netlify Forms 감지용 숨은 폼 (실제 전송은 앱 안 폼에서 함) -->
  <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="message" />
    <input type="email" name="email" />
    <input type="text" name="bot-field" />
  </form>

  <!-- 백업 복원용 숨은 input -->
  <input type="file" id="restoreInput" accept=".txt,.json,text/plain,application/json" hidden />

  <!-- 토스트 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="scripts-data.js"></script>
  <script src="analytics.js"></script>
  <script src="app.js"></script>
</body>
</html>
