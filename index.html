<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141a3a" />
  <meta name="description" content="엄마·아빠 목소리로 읽어주는 우리 아기 잠자리 그림책, 별밤책. 녹음도 재생도 이 기기 안에서만." />
  <title>별밤책 🌙</title>

  <!-- PWA / 홈화면 추가 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="별밤책" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@700&family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 밤하늘 배경 (모든 화면 공통) -->
  <div class="night-sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="moon"></div>
  </div>

  <!-- ===== 홈 화면: 이야기 고르기 ===== -->
  <section id="home" class="screen active">
    <header class="home-head">
      <!-- 아기 이름: 넣으면 제목 위에 "○○이의", 없으면 아래 알약 버튼 -->
      <button id="nameOwner" class="name-owner" type="button" hidden></button>
      <h1 class="app-title">별밤책</h1>
      <p class="app-sub">오늘은 어떤 이야기를 들려줄까요?</p>
      <button id="nameChip" class="name-chip" type="button">👶 아기 이름 정하기</button>
    </header>

    <ul id="storyList" class="story-list" aria-label="이야기 목록"></ul>

    <footer class="home-foot">
      <button id="moreBtn" class="foot-link" type="button">⚙️ 더보기</button>
      <p class="privacy-note" id="footNote"></p>
    </footer>
  </section>

  <!-- ===== 녹음 화면(부모용): 장면마다 녹음하고 확인 ===== -->
  <section id="rec" class="screen rec-screen">
    <div class="rec-top">
      <div class="topbar">
        <button id="recHome" class="homebtn" type="button" aria-label="이야기 목록으로">🏠</button>
        <h2 id="recTitle" class="rec-title">이야기</h2>
        <span class="head-spacer" aria-hidden="true"></span>
      </div>
      <div class="voices" role="tablist" aria-label="목소리 고르기">
        <button class="vtab on" data-voice="mom" role="tab">👩 엄마</button>
        <button class="vtab" data-voice="dad" role="tab">👨 아빠</button>
      </div>
      <div id="recProg" class="prog"></div>
      <p id="legacyNote" class="legacy-note" hidden></p>
    </div>

    <div class="stage">
      <div id="recArt" class="art scene-in">🌙</div>
      <div id="recText" class="text scene-in"></div>
    </div>

    <div id="recBottom" class="rec-bottom"></div>
  </section>

  <!-- ===== 들려주기 화면(아기용): 목소리 따라 그림이 넘어감 ===== -->
  <section id="play" class="screen play-screen">
    <div id="playStage" class="stage">
      <div id="playArt" class="art scene-in">🌙</div>
      <div id="playText" class="text scene-in"></div>
    </div>
    <div id="pauseOv" class="pause-ov" hidden></div>
  </section>

  <!-- ===== 공용 모달(이름 · 더보기[백업·도움말·의견]) ===== -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button id="modalClose" class="modal-close" aria-label="닫기">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Netlify Forms 감지용 숨은 폼 (실제 전송은 앱 안 폼에서 함) -->
  <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="message" />
    <input type="email" name="email" />
    <input type="text" name="bot-field" />
  </form>

  <!-- 백업 복원용 숨은 input -->
  <input type="file" id="restoreInput" accept=".txt,.json,text/plain,application/json" hidden />

  <!-- 토스트 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="scripts-data.js"></script>
  <script src="analytics.js"></script>
  <script src="app.js"></script>
</body>
</html>
