# ❌ 지금은 안 쓰는 설정 (기록용)
# 넷리파이는 처음에 써 보다가 v50에서 안 쓰기로 했다(무료 크레딧 소진).
# 공개 주소는 깃허브 페이지 하나뿐: https://minjung9767-gif.github.io/voice-book/
# 이 파일은 나중에 다시 쓸 때를 위해 남겨 둔다 — 깃허브 페이지에서는 아무 영향이 없다.

# Netlify 배포 설정
# 이 저장소는 '우리 목소리 책' 앱 전용이라, 저장소 루트가 곧 사이트의 첫 화면이다.
# 그래서 주소가 https://voice-book.netlify.app/ 로 바로 열린다.

[build]
  publish = "."
  # 빌드 과정이 없는 순수 HTML/JS라 build command 는 필요 없음.

# 서비스워커/매니페스트가 항상 최신으로 받아지도록 캐시를 짧게
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# index.html 은 절대 오래 갖고 있지 않게 한다.
# 폰이 예전 index.html 을 붙잡고 있으면 '예전 뼈대 + 새 app.js' 반쪽 상태가 되어
# 화면이 텅 빈다(v47에서 실제로 겪음). 파일들은 주소에 ?v= 가 붙어 있어 따로 캐시돼도 안전하다.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
